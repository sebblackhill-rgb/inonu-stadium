name: Pyramid staging QA (isolated)
on:
  push:
    branches: [codex/pyramid-stabilization-20261119, codex/v17-pyramid-cinematic-20261120, codex/v18-gameplay-pyramid-20261120, codex/v19-pyramid-finale-20261120, codex/v20-release-pyramid-20261120]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/game.js
      - run: node --check vendor/three.min.js
      - run: node --test tests/*.test.mjs
      - name: Preserve exact tested Pyramid staging source for export
        uses: actions/upload-artifact@v4
        with:
          name: pyramid-v20-source
          path: |
            .nojekyll
            index.html
            styles.css
            src/
            vendor/
            archive/
            tests/
            README.md
            SOURCE-MANIFEST.json
          retention-days: 30
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.58.2
      - name: Localhost Pyramid browser QA, never actual LIVE
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 > /tmp/pyramid-http.log 2>&1 &
          sleep 2
          timeout 180s node tests/browser-smoke.mjs
          timeout 180s node tests/match-cycle-browser.mjs
          timeout 150s node tests/natural-soak-browser.mjs
          timeout 150s node tests/v17-cinematic-browser.mjs
          timeout 150s node tests/v18-viewer-browser.mjs
          timeout 150s node tests/v19-finale-browser.mjs
          timeout 150s node tests/v20-obs-browser.mjs
          timeout 150s node tests/v20-live-mock-browser.mjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyramid-staging-browser-evidence
          path: |
            browser-evidence/*.png
            browser-evidence/*.json
          if-no-files-found: warn
          retention-days: 14
