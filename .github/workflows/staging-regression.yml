name: Staging regression checks
on:
  push:
    branches: [codex/stabilization-20261119]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse all game modules and build HTML
        run: |
          for f in src/*.js; do node --check "$f"; done
          bash build.sh
      - name: Source-anchored regression checks
        run: node --test tests/stabilization.test.mjs
